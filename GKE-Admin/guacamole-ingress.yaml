apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guacamole-ingress
  namespace: guacamole-system
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "guacamole-static-ip"
    networking.gke.io/managed-certificates: "guacamole-managed-cert"
    networking.gke.io/v1beta1.FrontendConfig: "guacamole-frontend-config"
spec:
  rules:
  - host: xmobile.tylshiloh.me
    http:
      paths:
      # API de l'orchestrateur (création / suppression de session)
      - path: /session/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: rdp-orchestrator-service
            port:
              number: 3000
      # Tout le reste (HTML5 RDP + WebSocket) vers Guacamole
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: guacamole-service
            port:
              number: 8080