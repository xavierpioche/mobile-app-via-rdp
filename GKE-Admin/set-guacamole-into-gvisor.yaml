apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-server
  namespace: guacamole-system
spec:
  replicas: 2
  template:
    spec:
      runtimeClassName: gvisor
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
      tolerations:
      - key: "sandbox.gke.io/runtime"
        operator: "Equal"
        value: "gvisor"
        effect: "NoSchedule"