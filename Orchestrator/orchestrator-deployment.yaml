apiVersion: v1
kind: ServiceAccount
metadata:
  name: rdp-orchestrator-sa
  namespace: guacamole-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rdp-pod-manager
  namespace: rdp-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rdp-orchestrator-binding
  namespace: rdp-sessions
subjects:
  - kind: ServiceAccount
    name: rdp-orchestrator-sa
    namespace: guacamole-system
roleRef:
  kind: Role
  name: rdp-pod-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdp-orchestrator
  namespace: guacamole-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rdp-orchestrator
  template:
    metadata:
      labels:
        app: rdp-orchestrator
    spec:
      serviceAccountName: rdp-orchestrator-sa
      containers:
        - name: orchestrator
          image: africa-south1-docker.pkg.dev/lab-mobile-rdp-browser/rdp-browser-repo/rdp-orchestrator:v3
          ports:
            - containerPort: 3000
          env:
            - name: KIOSK_IMAGE
              value: "africa-south1-docker.pkg.dev/lab-mobile-rdp-browser/rdp-browser-repo/kiosk-rdp:v4"
            - name: GUAC_URL
              value: "http://guacamole-service.guacamole-system:8080/guacamole"
            - name: ALLOWED_ORIGINS
              value: "capacitor://localhost,https://localhost,http://localhost,http://localhost:8100"
            - name: JSON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  # Même secret que Guacamole (Guacamole/guacamole-deployment.yaml)
                  name: guacamole-json-secret
                  key: JSON_SECRET_KEY
            # Authentification : JWT HS256 des utilisateurs + jetons de destruction.
            # Secret créé hors dépôt :
            #   kubectl -n guacamole-system create secret generic orchestrator-auth \
            #     --from-literal=AUTH_JWT_SECRET="$(openssl rand -hex 32)" \
            #     --from-literal=WIPE_SECRET="$(openssl rand -hex 32)"
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orchestrator-auth
                  key: AUTH_JWT_SECRET
            - name: WIPE_SECRET
              valueFrom:
                secretKeyRef:
                  name: orchestrator-auth
                  key: WIPE_SECRET
            - name: JWT_AUDIENCE
              value: "rdp-orchestrator"
            - name: MAX_TOKEN_TTL_SECONDS
              value: "3600"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: rdp-orchestrator-backend-config
  namespace: guacamole-system
spec:
  # /session/start attend le démarrage du Pod gVisor (jusqu'à ~25 s)
  timeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 3000
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rdp-orchestrator-service
  namespace: guacamole-system
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "rdp-orchestrator-backend-config"}'
spec:
  type: ClusterIP
  selector:
    app: rdp-orchestrator
  ports:
    - port: 3000
      targetPort: 3000
