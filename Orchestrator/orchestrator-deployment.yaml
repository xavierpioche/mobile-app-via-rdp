apiVersion: v1
kind: ServiceAccount
metadata:
  name: rdp-orchestrator-sa
  namespace: guacamole-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rdp-pod-manager
  namespace: rdp-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rdp-orchestrator-binding
  namespace: rdp-sessions
subjects:
  - kind: ServiceAccount
    name: rdp-orchestrator-sa
    namespace: guacamole-system
roleRef:
  kind: Role
  name: rdp-pod-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdp-orchestrator
  namespace: guacamole-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rdp-orchestrator
  template:
    metadata:
      labels:
        app: rdp-orchestrator
    spec:
      serviceAccountName: rdp-orchestrator-sa
      containers:
        - name: orchestrator
          image: africa-south1-docker.pkg.dev/lab-mobile-rdp-browser/rdp-browser-repo/rdp-orchestrator:v1
          ports:
            - containerPort: 3000
          env:
            - name: GUAC_URL
              value: "http://cluster.local"
            - name: JSON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: guacamole-secrets
                  key: json-secret-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rdp-orchestrator-service
  namespace: guacamole-system
spec:
  type: ClusterIP
  selector:
    app: rdp-orchestrator
  ports:
    - port: 3000
      targetPort: 3000
