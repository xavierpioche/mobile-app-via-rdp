<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #fff; --text: #1d2433; --muted: #5d6779;
      --primary: #2f6fed; --border: #e3e7ef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.45;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    main {
      width: 100%; max-width: 420px; text-align: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 32px 22px;
    }
    .code { font-size: 64px; font-weight: 700; color: var(--primary); line-height: 1; }
    h1 { font-size: 20px; margin: 14px 0 8px; }
    p { color: var(--muted); font-size: 14px; }
    .path {
      margin-top: 14px; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
      color: var(--muted); word-break: break-all;
    }
    a.button {
      display: inline-block; margin-top: 22px; padding: 12px 20px; border-radius: 10px;
      background: var(--primary); color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>La page demandée n'existe pas ou a été déplacée.</p>
    <p class="path" id="path"></p>
    <a class="button" href="/">Retour à l'accueil</a>
  </main>
  <script>
    // Affiche le chemin demandé, sans les paramètres (ils peuvent contenir un jeton)
    document.getElementById('path').textContent = location.pathname;
  </script>
</body>
</html>
