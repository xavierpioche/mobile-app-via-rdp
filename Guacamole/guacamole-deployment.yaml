apiVersion: v1
kind: Secret
metadata:
  name: guacamole-json-secret
  namespace: guacamole-system
type: Opaque
stringData:
  JSON_SECRET_KEY: "719770f2696fb936b802d6dbb9dadede"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-server
  namespace: guacamole-system
  labels:
    app: guacamole
spec:
  # 1 seul réplica : les jetons Guacamole sont en mémoire, non partagés entre instances
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      initContainers:
        - name: fetch-json-auth-extension
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              mkdir -p /guac-home/extensions
              curl -fsSL "https://archive.apache.org/dist/guacamole/1.5.5/binary/guacamole-auth-json-1.5.5.tar.gz" | tar -xz -C /tmp
              cp /tmp/guacamole-auth-json-1.5.5/guacamole-auth-json-1.5.5.jar /guac-home/extensions/
          volumeMounts:
            - name: guac-home
              mountPath: /guac-home
      containers:
        - name: guacd
          image: guacamole/guacd:1.5.5
          ports:
            - containerPort: 4822
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        - name: guacamole-client
          image: guacamole/guacamole:1.5.5
          ports:
            - containerPort: 8080
          env:
            - name: GUACD_HOSTNAME
              value: "127.0.0.1"
            - name: GUACD_PORT
              value: "4822"
            - name: GUACAMOLE_HOME
              value: "/guac-home"
            - name: JSON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: guacamole-json-secret
                  key: JSON_SECRET_KEY
          volumeMounts:
            - name: guac-home
              mountPath: /guac-home
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: guac-home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-service
  namespace: guacamole-system
spec:
  selector:
    app: guacamole
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP